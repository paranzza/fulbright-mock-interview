<meta charset="utf-8">

<title>면접 연습</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e3e0da;
    --accent: #2f5bd3; --accent-text: #ffffff; --warn: #b45309; --hint-bg: #fff6dd; --hint-text: #7a5300;
    --fb-bg: #fdf0e7; --ok: #1f7a3a; --danger: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1f1e1c; --text: #f2f0eb; --muted: #a29e96; --line: #33312e;
      --accent: #6d8ff0; --accent-text: #0d0d0c; --warn: #f0a44b; --hint-bg: #2c2516; --hint-text: #f3cd73;
      --fb-bg: #2a211b; --ok: #5cc27e; --danger: #f07a6c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 20px 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 24px 0 8px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
  button, .btn {
    font: inherit; font-size: 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); padding: 12px 16px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; text-decoration: none; display: inline-block; text-align: center;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.45; }
  .full { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  input, textarea {
    font: inherit; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  textarea { min-height: 150px; resize: vertical; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 6px; }
  .status { font-size: 14px; color: var(--muted); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--danger); }
  .menu button { width: 100%; text-align: left; margin: 6px 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .back { padding: 8px 12px; font-size: 15px; }
  .qnum { color: var(--warn); font-weight: 700; }
  .question { font-size: 20px; font-weight: 600; line-height: 1.4; margin: 6px 0; }
  .ko { color: var(--muted); font-size: 14px; }
  .hint { background: var(--hint-bg); color: var(--hint-text); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; font-size: 15px; }
  .feedback { background: var(--fb-bg); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
  .timer { font-variant-numeric: tabular-nums; color: var(--muted); }
  .timer.over { color: var(--danger); font-weight: 600; }
  .sticky { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(env(safe-area-inset-bottom) + 4px); }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details .qid { color: var(--warn); font-weight: 700; font-size: 13px; }
  ul { padding-left: 20px; margin: 6px 0; }
  .note { color: var(--warn); font-size: 14px; }
  .hidden { display: none !important; }
  .rec-on { border-color: var(--danger); color: var(--danger); }
</style>
</head>

async function unlockVault(pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

// ---------- Claude (streaming, direct from the browser) ----------
async function claude({ system, user, effort = "low", onText, signal }) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey(),
      "anthropic-version": "2026-10-21",
      "anthropic-beta": "server-side-fallback-2026-07-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 2048,
      stream: true,
      fallbacks: "default",
      system: [{ type: "text", text: system, cache_control: { type: "ephemeral" } }],
      messages: [{ role: "user", content: user }],
      output_config: { effort },
    }),
  });
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    if (res.status === 401) throw new Error("API 키가 올바르지 않습니다. 설정에서 다시 확인해 주세요.");
    if (res.status === 400 && /credit/i.test(body)) throw new Error("API 크레딧이 부족합니다.");
    throw new Error(`API ${res.status}: ${body.slice(0, 200)}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", text = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      let event;
      try { event = JSON.parse(line.slice(5)); } catch { continue; }
      if (event.type === "content_block_delta" && event.delta?.type === "text_delta") {
        text += event.delta.text;
        onText?.(text);
      } else if (event.type === "message_delta" && event.delta?.stop_reason === "refusal") {
        throw new Error("요청이 거절되었습니다.");
      } else if (event.type === "error") {
        throw new Error(event.error?.message || "stream error");
      }
    }
  }
  return text.trim();
}

// ---------- speech ----------
let voice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang === "en-US" || v.lang === "en_US");
  voice = voices.find((v) => /premium|enhanced/i.test(v.name))
    || voices.find((v) => /samantha|ava|allison/i.test(v.name))
    || voices[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    if (voice) u.voice = voice;
    u.rate = settings().rate;
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

// ---------- answers.md parsing (same layout as the apps) ----------
function parseAnswers(text) {
  const sections = [];
  let item = null, inAnswer = false;
  const flush = () => { if (item && sections.length) sections[sections.length - 1].items.push(item); item = null; };
  for (const raw of (text || "").split("\n")) {
    const line = raw.trim();
    if (line.startsWith("### ")) {
      flush();
      const head = line.slice(4);
      const dot = head.indexOf(".");
      item = { id: dot > 0 ? head.slice(0, dot) : head, question: dot > 0 ? head.slice(dot + 1).trim() : head, points: [], notes: [], answer: [] };
      inAnswer = false;
    } else if (line.startsWith("## ")) {
      flush();
      sections.push({ title: line.slice(3), items: [] });
    } else if (item) {
      if (line === "핵심 포인트") inAnswer = false;
      else if (line === "예시 답변") inAnswer = true;
      else if (line.startsWith("※")) item.notes.push(line);
      else if (line.startsWith("- ") && !inAnswer) item.points.push(line.slice(2));
      else if (inAnswer && line && line !== "---") item.answer.push(line);
    }
  }
  flush();
  return sections.filter((s) => s.items.length);
}

// ---------- screens ----------
function topbar(title) {
  return `<div class="topbar"><button class="back" data-go="home">‹ 처음으로</button><span class="status">${esc(title)}</span></div>`;
}

function renderHome() {
  const hasKey = !!apiKey();
  const hasNotes = !!notes();
  app.innerHTML = `
    <h1>풀브라이트 모의 면접</h1>
    <p class="sub">면접관이 영어로 질문을 읽어주고, 내 답변에 피드백을 줍니다. ${TOTAL_QUESTIONS}문항, 15-20분.</p>
    ${!hasNotes && VAULT ? `<div class="card"><b>처음 한 번만:</b> 답변 자료 암호를 입력하세요.
      <label for="pass">자료 암호</label><input id="pass" type="password" autocomplete="off">
      <p></p><button class="primary full" id="unlock">열기</button><p id="unlockMsg" class="status"></p></div>` : ""}
    ${!hasKey ? `<div class="card"><b>처음 한 번만:</b> Anthropic API 키를 입력하세요. 이 아이폰 브라우저에만 저장됩니다.
      <label for="key">API 키</label><input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <p></p><button class="primary full" id="saveKey">저장</button></div>` : ""}
    <div class="menu">
      <button class="primary" id="start" ${hasKey ? "" : "disabled"}>🎙 모의 면접 시작</button>
      <button data-go="answers" ${hasNotes ? "" : "disabled"}>📋 예상 질문과 답변 보기</button>
      <button data-go="history">🗂 지난 연습 기록</button>
      <button data-go="settings">⚙️ 설정</button>
    </div>
    <p class="status">이어폰을 쓰면 질문 음성이 답변에 섞이지 않습니다. 실제 면접 때는 이 페이지를 닫아 두세요.</p>`;
  $("#unlock")?.addEventListener("click", async () => {
    const msg = $("#unlockMsg");
    try {
      store.set("notes", await unlockVault($("#pass").value));
      renderHome();
    } catch { msg.textContent = "암호가 맞지 않습니다."; msg.className = "status err"; }
  });
  $("#saveKey")?.addEventListener("click", () => {
    const k = $("#key").value.trim();
    if (k) { store.set("apiKey", k); renderHome(); }
  });
  $("#start")?.addEventListener("click", () => {
    // iOS only lets speech start from a tap: speak once here so later questions can play.
    if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
    startInterview();
  });
}

function renderSettings() {
  const s = settings();
  app.innerHTML = `${topbar("설정")}
    <div class="card">
      <label><input type="checkbox" id="hint" ${s.showHint ? "checked" : ""} style="width:auto"> 답변 힌트 보기</label>
      <label><input type="checkbox" id="ko" ${s.showKorean ? "checked" : ""} style="width:auto"> 질문 한국어 번역 보기</label>
      <label for="rate">질문 읽는 속도: <span id="rateVal">${s.rate}</span></label>
      <input id="rate" type="range" min="0.7" max="1.2" step="0.05" value="${s.rate}">
    </div>
    <div class="card">
      <div class="status">API 키: ${apiKey() ? '<span class="ok">저장됨</span>' : '<span class="warn">없음</span>'}</div>
      <p></p><button class="danger full" id="clearKey">API 키 지우기</button>
    </div>
    <div class="card">
      <div class="status">답변 자료: ${notes() ? '<span class="ok">열림</span>' : '<span class="warn">잠김</span>'}</div>
      <p></p><button class="danger full" id="clearNotes">이 기기에서 답변 자료 지우기</button>
    </div>`;
  const update = () => saveSettings({ ...settings(), showHint: $("#hint").checked, showKorean: $("#ko").checked, rate: Number($("#rate").value) });
  $("#hint").onchange = $("#ko").onchange = update;
  $("#rate").oninput = () => { $("#rateVal").textContent = $("#rate").value; update(); };
  $("#clearKey").onclick = () => { store.del("apiKey"); renderSettings(); };
  $("#clearNotes").onclick = () => { store.del("notes"); renderSettings(); };
}

function renderAnswers() {
  const sections = parseAnswers(notes()?.answers);
  app.innerHTML = `${topbar("예상 질문과 답변")}
    <p class="sub">예시 답변은 외워서 읽는 대본이 아닙니다. 핵심 포인트를 자기 말로 풀어 말하는 연습을 하세요.</p>
    ${sections.map((s) => `<h2>${esc(s.title)}</h2>` + s.items.map((q, i) => `
      <details>
        <summary><span class="qid">${esc(q.id)}</span><br>${esc(q.question)}</summary>
        <p><b>핵심 포인트</b></p><ul>${q.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
        ${q.notes.map((n) => `<p class="note">${esc(n)}</p>`).join("")}
        ${q.answer.length ? `<p><b>예시 답변</b> <button class="back" data-say="${esc(q.answer.join(" "))}">🔊 듣기</button></p><p>${esc(q.answer.join(" "))}</p>` : ""}
      </details>`).join("")).join("")}`;
  app.querySelectorAll("[data-say]").forEach((b) => b.addEventListener("click", () => speak(b.dataset.say)));
}

function renderHistory() {
  const sessions = store.get("sessions", []);
  app.innerHTML = `${topbar("지난 연습 기록")}
    ${sessions.length ? sessions.slice().reverse().map((s, i) => `
      <details><summary><b>${esc(s.date)}</b> · ${s.turns.length}문항</summary>
        ${s.turns.map((t, j) => `<div class="card"><div class="qnum">Q${j + 1}</div><div>${esc(t.question)}</div>
          <p class="status">내 답변 (${t.seconds}초)</p><p>${esc(t.answer || "(답변 없음)")}</p>
          <div class="feedback">${md(t.feedback)}</div></div>`).join("")}
        ${s.summary ? `<div class="card"><b>총평</b><div class="feedback">${md(s.summary)}</div></div>` : ""}
        <button class="full" data-download="${sessions.length - 1 - i}">⬇️ 파일로 저장</button>
      </details>`).join("") : `<p class="sub">아직 기록이 없습니다.</p>`}`;
  app.querySelectorAll("[data-download]").forEach((b) => b.addEventListener("click", () => downloadSession(sessions[Number(b.dataset.download)])));
}

function sessionMarkdown(s) {
  let out = `# 모의 면접 기록 (${s.date})\n\n`;
  s.turns.forEach((t, i) => {
    out += `## Q${i + 1}. ${t.question}\n\n**내 답변 (${t.seconds}초)**\n\n${t.answer || "(답변 없음)"}\n\n**피드백**\n\n${t.feedback}\n\n`;
  });
  if (s.summary) out += `## 총평\n\n${s.summary}\n`;
  return out;
}

function downloadSession(s) {
  const blob = new Blob([sessionMarkdown(s)], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `모의면접_${s.date.replace(/[: ]/g, "-")}.md`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ---------- mock interview ----------
let iv = null; // current interview state

function startInterview() {
  const now = new Date();
  iv = {
    date: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`,
    turns: [], question: "", korean: "", hint: "", feedback: "", stage: "", answering: false,
    start: 0, timer: null, rec: null, recording: false, abort: null, summary: "",
  };
  renderInterview();
  askNext();
}

function transcript() {
  return iv.turns.map((t, i) => `Q${i + 1}. ${t.question}\nAnswer (${t.seconds}s): ${t.answer || "(no answer)"}`).join("\n\n");
}

function renderInterview() {
  const s = settings();
  const n = Math.min(iv.turns.length + (iv.summaryMode ? 0 : 1), TOTAL_QUESTIONS);
  app.innerHTML = `
    <div class="topbar"><span class="qnum">${iv.summaryMode ? "총평" : `Q${n} / ${TOTAL_QUESTIONS}`}</span>
      <span class="timer" id="timer"></span></div>
    <p class="status" id="stage">${esc(iv.stage)}</p>
    <div id="qbox" class="${iv.question ? "" : "hidden"}">
      <div class="question" id="q">${esc(iv.question)}</div>
      <div class="ko ${s.showKorean ? "" : "hidden"}" id="ko">${esc(iv.korean)}</div>
    </div>
    <div class="hint ${s.showHint && iv.hint && iv.answering ? "" : "hidden"}" id="hint">${esc(iv.hint)}</div>
    <div id="answerBox" class="${iv.answering ? "" : "hidden"}">
      <label for="answer">내 답변 ${Recognition ? "(🎤 말하기를 누르거나" : "("}키보드의 🎤 받아쓰기로 말하세요)</label>
      <textarea id="answer" placeholder="여기에 답변이 받아적힙니다"></textarea>
    </div>
    <div class="feedback ${iv.feedback ? "" : "hidden"}" id="fb">${md(iv.feedback)}</div>
    <div class="sticky row">
      ${iv.answering && Recognition ? `<button id="mic">🎤 말하기</button>` : ""}
      ${iv.answering ? `<button class="primary" id="done">답변 끝</button>` : ""}
      ${!iv.answering && !iv.summaryMode ? `<button class="primary" id="next">${iv.turns.length >= TOTAL_QUESTIONS ? "총평 보기" : "다음 질문"}</button>` : ""}
      ${iv.question && !iv.summaryMode ? `<button id="replay">🔊 다시 듣기</button>` : ""}
      <button class="danger" id="quit">${iv.summaryMode ? "끝내기" : "종료"}</button>
    </div>`;
  $("#mic")?.addEventListener("click", toggleMic);
  $("#done")?.addEventListener("click", finishAnswer);
  $("#next")?.addEventListener("click", askNext);
  $("#replay")?.addEventListener("click", () => speak(iv.question));
  $("#quit").addEventListener("click", quitInterview);
}

const setStage = (text) => { iv.stage = text; const el = $("#stage"); if (el) el.textContent = text; };

async function askNext() {
  stopMic();
  if (iv.turns.length >= TOTAL_QUESTIONS) return summarize();
  Object.assign(iv, { question: "", korean: "", hint: "", feedback: "", answering: false });
  setStage("질문 준비 중…");
  renderInterview();
  const number = iv.turns.length + 1;
  try {
    iv.abort = new AbortController();
    const text = await claude({
      system: prompts.question(number, TOTAL_QUESTIONS),
      user: iv.turns.length ? `Interview so far:\n${transcript()}` : "The interview is starting now.",
      signal: iv.abort.signal,
      onText: (t) => { splitQuestion(t); $("#qbox")?.classList.remove("hidden"); $("#q").textContent = iv.question; $("#ko").textContent = iv.korean; },
    });
    splitQuestion(text);
    loadHint(iv.question);
    setStage("질문 읽는 중…");
    renderInterview();
    await speak(iv.question);
    startAnswering();
  } catch (e) {
    if (e.name !== "AbortError") { setStage(`오류: ${e.message}`); renderInterview(); }
  }
}

function splitQuestion(text) {
  const [q, ...rest] = text.split("\n").filter((l) => l.trim());
  iv.question = (q || "").trim();
  iv.korean = rest.join(" ").trim();
}

async function loadHint(question) {
  try {
    await claude({
      system: prompts.hint(), user: `Question: ${question}`,
      onText: (t) => { iv.hint = t; const el = $("#hint"); if (el) el.textContent = t; },
    });
  } catch { /* hints are optional */ }
}

function startAnswering() {
  iv.answering = true;
  iv.start = Date.now();
  setStage("답변하세요. 다 말했으면 '답변 끝'을 누르세요.");
  renderInterview();
  clearInterval(iv.timer);
  iv.timer = setInterval(() => {
    const el = $("#timer");
    if (!el || !iv.answering) return;
    const sec = Math.round((Date.now() - iv.start) / 1000);
    el.textContent = `${sec}초`;
    el.classList.toggle("over", sec > 70);
  }, 500);
}

function toggleMic() {
  if (iv.recording) return stopMic();
  const rec = new Recognition();
  rec.lang = "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  const box = $("#answer");
  const before = box.value ? box.value.trimEnd() + " " : "";
  rec.onresult = (e) => {
    let text = "";
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    box.value = before + text;
  };
  rec.onerror = (e) => { if (e.error === "not-allowed") setStage("마이크 권한이 없습니다. 키보드의 🎤 받아쓰기를 쓰세요."); };
  // Safari stops listening after a pause; keep going until the user taps again.
  rec.onend = () => { if (iv?.recording && iv.rec === rec) { try { rec.start(); } catch { stopMic(); } } };
  try { rec.start(); } catch { setStage("음성 인식을 시작하지 못했습니다. 키보드의 🎤 받아쓰기를 쓰세요."); return; }
  iv.rec = rec;
  iv.recording = true;
  const btn = $("#mic");
  if (btn) { btn.textContent = "⏹ 멈추기"; btn.classList.add("rec-on"); }
}

function stopMic() {
  if (!iv?.rec) return;
  iv.recording = false;
  try { iv.rec.stop(); } catch {}
  iv.rec = null;
  const btn = $("#mic");
  if (btn) { btn.textContent = "🎤 말하기"; btn.classList.remove("rec-on"); }
}

async function finishAnswer() {
  stopMic();
  clearInterval(iv.timer);
  const answer = ($("#answer")?.value || "").trim();
  const seconds = Math.round((Date.now() - iv.start) / 1000);
  const question = iv.question;
  iv.answering = false;
  iv.feedback = "";
  setStage("피드백 작성 중…");
  renderInterview();
  let feedback = "";
  try {
    feedback = await claude({
      system: prompts.feedback(seconds),
      user: `Question: ${question}\n\nHer answer (transcript): ${answer || "(no answer recognized)"}`,
      effort: "medium",
      onText: (t) => { iv.feedback = t; const el = $("#fb"); if (el) { el.classList.remove("hidden"); el.innerHTML = md(t); } },
    });
  } catch (e) {
    feedback = `피드백 오류: ${e.message}`;
  }
  iv.feedback = feedback;
  iv.turns.push({ question, answer, seconds, feedback });
  saveCurrent();
  setStage(iv.turns.length >= TOTAL_QUESTIONS ? "마지막 질문이었습니다." : "준비되면 '다음 질문'을 누르세요.");
  renderInterview();
}

async function summarize() {
  iv.summaryMode = true;
  Object.assign(iv, { question: "", korean: "", hint: "", feedback: "", answering: false });
  setStage("총평 작성 중…");
  renderInterview();
  try {
    iv.summary = await claude({
      system: prompts.summary(), user: transcript(), effort: "medium",
      onText: (t) => { iv.feedback = t; const el = $("#fb"); if (el) { el.classList.remove("hidden"); el.innerHTML = md(t); } },
    });
    iv.feedback = iv.summary;
    saveCurrent();
    setStage("기록은 '지난 연습 기록'에 저장되었습니다.");
  } catch (e) {
    setStage(`총평 오류: ${e.message}`);
  }
  renderInterview();
}

// Saves the interview in progress, replacing its earlier copy.
function saveCurrent() {
  const sessions = store.get("sessions", []).filter((s) => s.date !== iv.date);
  sessions.push({ date: iv.date, turns: iv.turns, summary: iv.summary });
  store.set("sessions", sessions.slice(-30));
}

function quitInterview() {
  stopMic();
  clearInterval(iv?.timer);
  iv?.abort?.abort();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  iv = null;
  renderHome();
}

// ---------- navigation ----------
app.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]")?.dataset.go;
  if (!go) return;
  ({ home: renderHome, settings: renderSettings, answers: renderAnswers, history: renderHistory })[go]?.();
  window.scrollTo(0, 0);
});

renderHome();
</script>
</body>
</html>
